name: Profile dashboard

on:
  schedule:
    - cron: "0 0 * * *" # daily, 05:30 IST
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/profile-dashboard.yml

permissions:
  contents: write

concurrency:
  group: profile-dashboard
  cancel-in-progress: false

jobs:
  cards:
    name: Stats, languages and pinned cards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=AkSingh03&show_icons=true&include_all_commits=true&count_private=true&theme=tokyonight&hide_border=true&border_radius=10
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=AkSingh03&layout=compact&langs_count=8&theme=tokyonight&hide_border=true&border_radius=10
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin - Disease-Analyser-Python-ML
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=AkSingh03&repo=Disease-Analyser-Python-ML&theme=tokyonight&hide_border=true&border_radius=10
          path: profile/pin-Disease-Analyser-Python-ML.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin - VirtualOS_Golang-Fyne
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=AkSingh03&repo=VirtualOS_Golang-Fyne&theme=tokyonight&hide_border=true&border_radius=10
          path: profile/pin-VirtualOS_Golang-Fyne.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin - MACHINE_LEARNING_4thYear
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=AkSingh03&repo=MACHINE_LEARNING_4thYear&theme=tokyonight&hide_border=true&border_radius=10
          path: profile/pin-MACHINE_LEARNING_4thYear.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin - Go-Fyne_Basics
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=AkSingh03&repo=Go-Fyne_Basics&theme=tokyonight&hide_border=true&border_radius=10
          path: profile/pin-Go-Fyne_Basics.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          if git diff --cached --quiet; then
            echo "No card changes."
          else
            git commit -m "chore: refresh profile dashboard cards"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi

  snake:
    name: Contribution snake
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
